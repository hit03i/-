<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Paint Industry News</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:system-ui;margin:20px;}
    h2{margin-top:30px;}
    .item{margin:6px 0;}
    .date{color:#666;font-size:12px;margin-right:6px;}
  </style>
</head>
<body>
  <h1>Paint Industry News</h1>
  <div id="app">Loading...</div>

  <script>
    fetch('news.json')
      .then(r => r.json())
      .then(data => {
        const app = document.getElementById('app');
        app.innerHTML = '';

        Object.keys(data).forEach(company => {
          const h2 = document.createElement('h2');
          h2.textContent = company;
          app.appendChild(h2);

          data[company].forEach(n => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML =
              `<span class="date">${n.date}</span>
               <a href="${n.url}" target="_blank">${n.title}</a>`;
            app.appendChild(div);
          });
        });
      })
      .catch(() => {
        document.getElementById('app').textContent = 'No data';
      });
  </script>
</body>
</html>
